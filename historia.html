<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAO MD · Historia</title>
<link rel="stylesheet" href="pantalla.css">
</head>
<body>
<main id="viewport-juego" aria-label="Historia de SAO Memory Defrag">
<canvas id="c"></canvas>
<div id="carga">Cargando…</div>
</main>
<script type="module">
  // Visor de diálogos: historia.html?id=<historia> o ?mision=<misión> (todas las de la misión, en orden).
  import './js/importador/comprobar.js';
  import { Historia, historiasDeMision } from './js/ui/historia.js';
  const params = new URLSearchParams(location.search);
  const canvas = document.getElementById('c');
  const ajustar = () => {
    const r = canvas.getBoundingClientRect(), dpr = devicePixelRatio || 1;
    canvas.width = Math.max(1, Math.round(r.width * dpr));
    canvas.height = Math.max(1, Math.round(r.height * dpr));
  };
  new ResizeObserver(ajustar).observe(canvas);
  addEventListener('resize', ajustar);
  ajustar();
  const ids = params.has('mision') ? (await historiasDeMision(params.get('mision'))).map((h) => h.id) : [params.get('id') ?? '1001'];
  document.getElementById('carga').remove();
  for (const id of ids) {
    const h = await Historia.cargar(id);
    window.__historia = h;
    if (h) await h.reproducir(canvas);
  }
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#9fd3ff';
  ctx.font = `${16 * devicePixelRatio}px "Segoe UI", sans-serif`;
  ctx.fillText('Fin', 20 * devicePixelRatio, 30 * devicePixelRatio);
</script>
</body>
</html>
